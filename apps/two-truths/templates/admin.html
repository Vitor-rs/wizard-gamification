<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Two Truths & A Lie | Wizard Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/wizard-ds.css">
  <style>
    body { background: var(--wiz-off-white); }
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .net-banner {
      background: linear-gradient(135deg, var(--wiz-navy-dark), var(--wiz-navy));
      color: var(--wiz-white);
      padding: 18px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--wiz-orange);
    }
    .net-banner__info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .net-banner__ip {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      color: var(--wiz-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qr-card-center {
      text-align: center;
      padding: 24px 16px;
    }
    .qr-card-center img {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-md);
      border: 3px solid var(--wiz-navy);
      box-shadow: var(--shadow-md);
    }
    .player-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--wiz-white);
      border: 1px solid var(--wiz-gray-200);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--wiz-navy);
      box-shadow: var(--shadow-sm);
    }
    .player-chip__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .player-chip__dot--online  { background: #27ae60; box-shadow: 0 0 6px rgba(39, 174, 96, 0.6); }
    .player-chip__dot--offline { background: #bdc3c7; }
    .player-chip__remove {
      background: none;
      border: none;
      color: var(--wiz-gray-400);
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color var(--transition-fast);
    }
    .player-chip__remove:hover {
      color: var(--wiz-error);
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .status-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--wiz-gray-200);
      background: var(--wiz-white);
    }
    .status-chip--done {
      background: var(--wiz-success-bg);
      border-color: rgba(39, 174, 96, 0.3);
      color: var(--wiz-success);
    }
    .status-chip--pending {
      background: var(--wiz-off-white);
      color: var(--wiz-gray-600);
    }
    .big-counter {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 900;
      color: var(--wiz-navy);
      line-height: 1;
      margin: 12px 0;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--wiz-navy-dark);
      color: var(--wiz-white);
      padding: 12px 20px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      font-weight: 600;
      display: none;
      z-index: 1000;
      animation: fadeInUp 0.3s ease;
    }
  </style>
</head>
<body>

  <header class="wiz-header">
    <div class="wiz-header__logo">
      <img src="/static/img/wizard-logo-white.svg" alt="Wizard by Pearson" class="wiz-logo-img">
      <div style="border-left: 1px solid rgba(255,255,255,0.2); padding-left: 12px; margin-left: 4px;">
        <div class="wiz-header__title">TWO TRUTHS &amp; A LIE</div>
        <div class="wiz-header__subtitle">PAINEL DO PROFESSOR (ADMIN)</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="adminNetStatus" class="badge badge--success">● Online</div>
      <button class="btn btn--outline btn--sm" style="color:var(--wiz-white);border-color:rgba(255,255,255,0.4)" onclick="confirmReset()">
        🔄 Reiniciar
      </button>
    </div>
  </header>

  <main class="admin-container" id="app">
    <div class="text-center mt-4">
      <div style="font-size:48px" class="anim-pulse">⏳</div>
      <p style="color:var(--wiz-gray-600);margin-top:12px;font-weight:600">Conectando ao servidor local...</p>
    </div>
  </main>

  <div id="toast" class="toast">Link copiado com sucesso!</div>

  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CONFIGURAÇÃO & WEBSOCKET
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const HOST = window.location.hostname || "{{ host }}";
    const PORT = window.location.port || "{{ port }}";
    const wsProto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const WS_URL = `${wsProto}//${window.location.host}/ws/admin`;

    let ws = null;
    let pingInterval = null;
    let gameState = null;
    let onlineStudents = {};
    let networkInfo = null;

    // Carrega dados de rede
    async function loadNetworkInfo() {
      try {
        const res = await fetch("/api/network-info");
        networkInfo = await res.json();
        if (gameState) render();
      } catch(e) {}
    }
    loadNetworkInfo();

    function connectWS() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        const pill = document.getElementById("adminNetStatus");
        if (pill) { pill.className = "badge badge--success"; pill.textContent = "● Online"; }
        startHeartbeat();
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "pong") return;
          if (msg.type === "game_state") {
            gameState = msg.data;
            if (msg.online_students) onlineStudents = msg.online_students;
            render();
          }
        } catch(err) {}
      };

      ws.onclose = () => {
        clearInterval(pingInterval);
        const pill = document.getElementById("adminNetStatus");
        if (pill) { pill.className = "badge badge--error"; pill.textContent = "● Reconectando"; }
        setTimeout(connectWS, 1500);
      };

      ws.onerror = () => ws.close();
    }

    function startHeartbeat() {
      clearInterval(pingInterval);
      pingInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: "ping" }));
        }
      }, 8000);
    }

    function send(action, data = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action, ...data }));
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      if (toast) {
        toast.textContent = msg;
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 2500);
      }
    }

    function copyStudentUrl() {
      const activeIp = (networkInfo && networkInfo.active_ip) ? networkInfo.active_ip : HOST;
      const url = `http://${activeIp}:${PORT}/student`;
      navigator.clipboard.writeText(url).then(() => {
        showToast("Link dos alunos copiado: " + url);
      }).catch(() => {
        prompt("Copie o link abaixo:", url);
      });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER DO PAINEL ADMIN
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function render() {
      const app = document.getElementById("app");
      if (!gameState || !app) return;

      const { phase, players, player_count } = gameState;
      const playerList = Object.values(players || {});

      const activeIp = (networkInfo && networkInfo.active_ip) ? networkInfo.active_ip : HOST;
      const studentUrl = `http://${activeIp}:${PORT}/student`;
      const displayUrl = `http://${HOST}:${PORT}/display`;

      let content = "";

      switch (phase) {
        case "lobby":
          content = renderLobbyView(playerList, studentUrl, displayUrl, activeIp);
          break;
        case "submitting":
          content = renderSubmittingView(playerList);
          break;
        case "evaluating":
          content = renderEvaluatingView(playerList);
          break;
        case "results":
          content = renderResultsView(playerList);
          break;
      }

      app.innerHTML = content;
    }

    // ─── 1. LOBBY VIEW ──────────────────────────────────────
    function renderLobbyView(players, studentUrl, displayUrl, activeIp) {
      return `
        <!-- Banner de Rede Wi-Fi -->
        <div class="net-banner">
          <div class="net-banner__info">
            <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--wiz-gray-400)">
              Rede Local da Sala de Aula
            </div>
            <div class="net-banner__ip">
              📡 Wi-Fi IP: <span>${activeIp}</span>
            </div>
            <div style="font-size:13px;color:rgba(255,255,255,0.7)">
              Alunos e professor conectados no mesmo roteador
            </div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn--primary btn--md" onclick="copyStudentUrl()">
              📋 Copiar Link dos Alunos
            </button>
            <a href="${displayUrl}" target="_blank" class="btn btn--secondary btn--md" style="color:#fff">
              📺 Abrir Projetor
            </a>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:20px;margin-bottom:24px">
          <!-- QR Code para Alunos -->
          <div class="card qr-card-center">
            <h3 style="font-size:18px;margin-bottom:6px">📱 QR Code de Acesso</h3>
            <p style="color:var(--wiz-gray-600);font-size:13px;margin-bottom:14px">
              Aponte a câmera do celular para entrar
            </p>
            <img src="/qr?ip=${encodeURIComponent(activeIp)}" alt="QR Code">
            <div style="font-size:14px;font-weight:700;color:var(--wiz-orange);margin-top:12px;word-break:break-all">
              ${studentUrl}
            </div>
          </div>

          <!-- Lista de Alunos na Sala -->
          <div class="card" style="padding:20px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
              <h3 style="font-size:18px">👥 Alunos Conectados (${players.length})</h3>
              <span class="badge ${players.length >= 2 ? 'badge--success' : 'badge--orange'}">
                ${players.length >= 2 ? 'Pronto para iniciar' : 'Mínimo 2 alunos'}
              </span>
            </div>

            <!-- Adicionar aluno manualmente para teste rápido -->
            <div style="display:flex;gap:8px;margin-bottom:16px">
              <input
                id="manualPlayerName"
                class="input"
                placeholder="Adicionar aluno para teste..."
                onkeydown="if(event.key==='Enter')addManualPlayer()"
              >
              <button class="btn btn--primary btn--md" onclick="addManualPlayer()">+ Add</button>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow-y:auto;padding:4px">
              ${players.map(p => {
                const isOnline = onlineStudents[p.id] !== false;
                return `
                  <div class="player-chip">
                    <span class="player-chip__dot ${isOnline ? 'player-chip__dot--online' : 'player-chip__dot--offline'}" title="${isOnline?'Conectado':'Desconectado'}"></span>
                    <span>${p.emoji}</span>
                    <span>${escapeHtml(p.name)}</span>
                    <button class="player-chip__remove" onclick="removePlayer('${p.id}')" title="Remover aluno">✕</button>
                  </div>
                `;
              }).join("")}
              ${players.length === 0 ? '<p style="color:var(--wiz-gray-400);font-size:14px">Aguardando os alunos escanearem o QR Code...</p>' : ''}
            </div>
          </div>
        </div>

        <!-- Botão Iniciar -->
        <div class="text-center" style="margin-top:16px">
          <button
            class="btn btn--primary btn--xl"
            ${players.length < 2 ? 'disabled' : ''}
            onclick="send('start_submissions')"
          >
            🚀 Iniciar Escrita das Frases (${players.length} alunos)
          </button>
          ${players.length < 2 ? `
            <p style="color:var(--wiz-gray-400);font-size:13px;margin-top:8px">
              Necessário pelo menos 2 alunos na sala.
            </p>
          ` : ''}
        </div>
      `;
    }

    // ─── 2. SUBMITTING VIEW ─────────────────────────────────
    function renderSubmittingView(players) {
      const submitted = gameState.submissions_count;
      const total = gameState.player_count;
      const pct = total > 0 ? (submitted / total) * 100 : 0;

      return `
        <div class="card text-center mb-3" style="padding:28px 20px">
          <span class="badge badge--orange" style="margin-bottom:12px">Fase 1: Escrita das Frases</span>
          <h2 style="font-size:26px;margin-bottom:6px">Alunos Escrevendo as Frases</h2>
          <p style="color:var(--wiz-gray-600);font-size:14px">
            Cada aluno está escrevendo 2 verdades e 1 mentira no celular.
          </p>

          <div class="big-counter">${submitted} / ${total}</div>

          <div class="progress" style="max-width:500px;margin:0 auto 20px">
            <div class="progress__fill" style="width:${pct}%"></div>
          </div>

          <div class="status-grid">
            ${players.map(p => `
              <div class="status-chip ${p.has_submitted ? 'status-chip--done' : 'status-chip--pending'}">
                <span style="display:flex;align-items:center;gap:6px">
                  <span>${p.emoji}</span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px">${escapeHtml(p.name)}</span>
                </span>
                <span style="display:flex;align-items:center;gap:6px">
                  <span>${p.has_submitted ? '✓ Enviado' : '⏳ Escrevendo'}</span>
                  <button class="player-chip__remove" onclick="removePlayer('${p.id}')" title="Remover aluno ausente">✕</button>
                </span>
              </div>
            `).join("")}
          </div>

          <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap">
            <button
              class="btn btn--primary btn--lg"
              ${gameState.all_submitted ? '' : 'disabled'}
              onclick="send('start_evaluation')"
            >
              ▶️ Iniciar Classificação Cruzada
            </button>
            <button class="btn btn--outline btn--md" onclick="send('start_evaluation')">
              ⚡ Forçar Início (Ignorar Alunos Ausentes)
            </button>
          </div>
        </div>
      `;
    }

    // ─── 3. EVALUATING VIEW ─────────────────────────────────
    function renderEvaluatingView(players) {
      const done = gameState.evaluations_count;
      const total = gameState.player_count;
      const pct = total > 0 ? (done / total) * 100 : 0;

      return `
        <div class="card text-center mb-3" style="padding:28px 20px">
          <span class="badge badge--success" style="margin-bottom:12px">Fase 2: Detector de Mentiras</span>
          <h2 style="font-size:26px;margin-bottom:6px">Classificação Cruzada</h2>
          <p style="color:var(--wiz-gray-600);font-size:14px">
            Os alunos estão analisando as frases dos colegas e caçando as mentiras.
          </p>

          <div class="big-counter">${done} / ${total}</div>

          <div class="progress" style="max-width:500px;margin:0 auto 20px">
            <div class="progress__fill progress__fill--success" style="width:${pct}%"></div>
          </div>

          <div class="status-grid">
            ${players.map(p => `
              <div class="status-chip ${p.eval_done ? 'status-chip--done' : 'status-chip--pending'}">
                <span style="display:flex;align-items:center;gap:6px">
                  <span>${p.emoji}</span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px">${escapeHtml(p.name)}</span>
                </span>
                <span style="display:flex;align-items:center;gap:6px">
                  <span>${p.eval_done ? '✅ Terminou' : '⏳ Avaliando'}</span>
                  <button class="player-chip__remove" onclick="removePlayer('${p.id}')" title="Remover aluno ausente">✕</button>
                </span>
              </div>
            `).join("")}
          </div>

          <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap">
            <button
              class="btn btn--success btn--xl"
              ${gameState.all_evaluated ? '' : 'disabled'}
              onclick="send('show_results')"
            >
              🏆 Revelar Placar e Vencedores
            </button>
            <button class="btn btn--outline btn--md" onclick="send('force_results')">
              ⚡ Revelar Agora (sem esperar todos)
            </button>
          </div>
        </div>
      `;
    }

    // ─── 4. RESULTS VIEW ────────────────────────────────────
    function renderResultsView(players) {
      const rankings = gameState.rankings || [];
      const maxScore = gameState.max_score || 0;

      return `
        <div class="card text-center mb-3" style="padding:28px 20px">
          <div style="font-size:52px;margin-bottom:8px">🏆</div>
          <h2 style="font-size:28px;margin-bottom:4px">Resultados da Rodada</h2>
          <p style="color:var(--wiz-gray-600);margin-bottom:24px">
            Pontuações calculadas pelo algoritmo Detector de Mentiras
          </p>

          <div style="max-width:650px;margin:0 auto">
            ${rankings.map((p, i) => `
              <div style="
                display:flex;align-items:center;gap:12px;
                padding:12px 18px;margin-bottom:8px;
                border-radius:var(--radius-md);
                background:${i < 3 ? 'var(--wiz-orange-pale)' : 'var(--wiz-off-white)'};
                border:${i === 0 ? '2px solid var(--wiz-orange)' : '1px solid var(--wiz-gray-200)'};
              ">
                <span style="font-family:var(--font-display);font-weight:800;font-size:${i < 3 ? 24 : 16}px;width:36px;color:var(--wiz-navy)">
                  ${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1)}
                </span>
                <span style="font-size:26px">${p.emoji}</span>
                <span style="flex:1;text-align:left;font-weight:700;font-size:16px;color:var(--wiz-navy)">
                  ${escapeHtml(p.name)}
                </span>
                <span style="font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--wiz-orange)">
                  ${p.score} pts
                </span>
              </div>
            `).join("")}
          </div>

          <div style="margin-top:32px">
            <button class="btn btn--primary btn--xl" onclick="send('reset')">
              🔄 Nova Rodada (Voltar ao Lobby)
            </button>
          </div>
        </div>
      `;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // AÇÕES DO ADMIN
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function addManualPlayer() {
      const input = document.getElementById("manualPlayerName");
      const name = input ? input.value.trim() : "";
      if (name) {
        send("add_player", { name: name, emoji: "🦅" });
        input.value = "";
      }
    }

    function removePlayer(id) {
      if (confirm("Deseja remover este aluno da sala?")) {
        send("remove_player", { player_id: id });
      }
    }

    function confirmReset() {
      if (confirm("Tem certeza que deseja reiniciar o jogo e voltar ao Lobby?")) {
        send("reset");
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Inicia WebSocket
    connectWS();
  </script>
</body>
</html>
