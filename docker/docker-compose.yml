version: '3.8'

services:
  # ==========================================
  # 1. QUIZZLE (Lightweight school quiz)
  # ==========================================
  quizzle:
    image: node:20-alpine
    container_name: wizard_quizzle
    working_dir: /app
    volumes:
      - ../apps/quizzle:/app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    command: sh -c "node server/index.js"
    restart: unless-stopped

  # ==========================================
  # 2. DARKHOLD (Gamified, team battles)
  # ==========================================
  darkhold:
    image: surajcm/darkhold
    container_name: wizard_darkhold
    ports:
      - "8181:8181"
    environment:
      - JAVA_OPTS=-Xmx512m
    volumes:
      - darkhold_data:/tmp/db
    restart: unless-stopped

  # ==========================================
  # 3. PAPERCLICKERS WEB (Offline card scanner)
  # ==========================================
  paperclickers:
    image: node:20-alpine
    container_name: wizard_paperclickers
    working_dir: /app
    volumes:
      - ../apps/paperclickers/web:/app
      - ../apps/paperclickers/topcodes:/app/public/topcodes
      - ../packages/ai-quiz-engine/output:/app/public/quizzes
    ports:
      - "4500:4500"
    environment:
      - PORT=4500
      - NODE_ENV=production
    command: sh -c "node server.js"
    restart: unless-stopped

volumes:
  darkhold_data:
